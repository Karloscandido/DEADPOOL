<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DEADPOOL</title>
    <!-- Links para o PWA (Instalar no celular) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#800080">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Biblioteca do Player Clappr -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
    
    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background-color: #1a1a1a;
            border-bottom: 3px solid #800080;
        }
        #header h1 {
            color: #00FF00;
            margin: 0;
            font-size: 28px;
            text-transform: uppercase;
        }
        #player-container {
            width: 90%;
            max-width: 640px;
            margin: 20px 0;
            border: 2px solid #800080;
            background-color: #111;
        }
        #menu-container {
            width: 90%;
            max-width: 640px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
        }
        .btn-canal {
            background-color: #800080;
            color: #00FF00;
            border: 1px solid #00FF00;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            text-align: center;
            transition: 0.3s;
        }
        .btn-canal:hover {
            background-color: #00FF00;
            color: #800080;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>DEADPOOL</h1>
    </div>

    <div id="player-container">
        <div id="player"></div>
    </div>

    <div id="menu-container">
        <button class="btn-canal" onclick="changeSource('https://multiplatform-f.akamaihd.net/i/multi/will/apple/master_1600.m3u8')">CANAIS FECHADOS</button>
        <button class="btn-canal" onclick="changeSource('https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8')">FILMES E SÉRIES</button>
        <button class="btn-canal" onclick="alert('Grade de Programação Em Breve!')">GRADE DE PROGRAMAÇÃO</button>
    </div>

    <script type="text/javascript">
        // Inicializa o player Clappr com um vídeo padrão
        var player = new Clappr.Player({
            source: "https://multiplatform-f.akamaihd.net/i/multi/will/apple/master_1600.m3u8",
            parentId: "#player",
            width: "100%",
            height: "360px",
            autoPlay: false
        });

        // Função para mudar o canal/link ao clicar no botão
        function changeSource(newUrl) {
            player.load(newUrl);
            player.play();
        }
    </script>

    <!-- Script de registro do Service Worker para o PWA funcionar -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA carregado com sucesso!', reg))
                .catch(err => console.log('Erro ao carregar PWA:', err));
            });
        }
    </script>
</body>
</html>
